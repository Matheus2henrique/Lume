name: Deploy React to GitHub Pages

# ⚠️ Pré-requisito (uma vez): no repositório vá em
# Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main, master]
  workflow_dispatch: # permite publicar manualmente

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend # <-- avisa o Action para rodar na pasta certa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # URL da API publicada (Settings → Secrets and variables → Actions
          # → Variables → VITE_API_URL). Sem ela o site usa o catálogo mock.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist' # <-- aponta para o dist dentro de frontend

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
