name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · testes + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes
        run: npm test
      - name: Audit de dependências (bloqueia com vulnerabilidade high/critical)
        run: npm audit --audit-level=high

  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Defina VITE_API_URL em Settings → Secrets and variables → Actions
          # → Variables (ex.: https://sua-api.com/api). Vazio = catálogo mock.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # Ainda há 4 advisories em ferramentas de build (postcss/browserslist/nanoid).
      # Corrigir com `npm audit fix` no Windows e então remover continue-on-error.
      - name: Audit (informativo por enquanto)
        run: npm audit --audit-level=high
        continue-on-error: true

  docker:
    name: Docker · build da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem do backend
        run: docker build -t lume-backend:ci ./backend
